<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <!--
        A server-rendered passkey sign-in page, served at the requested address. It makes no data
        request and has no password field, so neither the refused-request rule nor the
        password-field rule has anything to see. It has a real control to focus, so the body-only
        floor is silent too.
      -->
      <p>Use the passkey saved on this device.</p>
      <button id="passkey" type="button">Sign in with a passkey</button>
    </main>
  </body>
</html>
